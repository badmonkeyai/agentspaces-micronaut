name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Least privilege for the default GITHUB_TOKEN: the build only reads.
permissions:
  contents: read

env:
  # The companion wire records. Until agentspaces-model-wire 0.3.0 is on
  # Maven Central, CI builds it from its repository first; once it is, the
  # two "wire" steps can be removed. The AgentSpaces core 0.3.0 resolves
  # from Maven Central.
  MODEL_WIRE_REF: main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up JDK 25
        # The library is Java 21 bytecode; Micronaut 5.2 itself is Java 25
        # bytecode, so the tests run on 25.
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Check out agentspaces-model-wire
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: badmonkeyai/agentspaces-model-wire
          ref: ${{ env.MODEL_WIRE_REF }}
          path: agentspaces-model-wire-src
      - name: Install agentspaces-model-wire
        run: mvn -B -ntp -f agentspaces-model-wire-src/pom.xml install -DskipTests
      - name: Build, test, and attach sources and javadoc
        # -Pexamples: the example applications build and test with the library.
        # The publication profile runs unsigned here, so a javadoc or packaging
        # problem fails the pull request rather than the release.
        run: mvn -B -ntp verify -Pexamples -Pcentral-publish -Dgpg.skip=true
